name: Build AshuPhone (APK)

# One job: build and sign a single release APK, then publish it as a GitHub Release.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Create Firebase config from raw GitHub Secret.
      # IMPORTANT: this secret's value must be the LITERAL, raw contents of
      # google-services.json (copy-pasted straight from Firebase Console),
      # NOT base64-encoded - unlike ASHU_RELEASE_KEYSTORE_BASE64 below, which
      # IS base64 (keystores are binary, JSON isn't, so it never needed that
      # encoding step). If Google Sign-In isn't working, the first thing to
      # check is which of these two forms is actually in the
      # GOOGLE_SERVICES_JSON secret right now. The (more likely) non-CI causes:
      # wrong Firebase Android app / package name, or a missing SHA-1
      # fingerprint registered against the release keystore.
      - name: Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON secret is empty or not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
          # Fail fast with a clear message if the secret's raw content isn't
          # valid JSON, instead of a confusing Gradle plugin error later -
          # this is the single most common cause (secret pasted as base64,
          # or with escaped/mangled quotes from a shell copy-paste).
          if ! python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null; then
            echo "❌ google-services.json is not valid JSON."
            echo "   The GOOGLE_SERVICES_JSON secret must contain the RAW file"
            echo "   contents copied directly from Firebase Console, not base64"
            echo "   and not re-encoded."
            exit 1
          fi

      # Install Gradle 8.7
      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Generate wrapper files
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Restore the persistent release keystore from GitHub Secrets.
      # This is the SAME key every single build - required so a rebuilt
      # APK is always recognized by Android as an "update" to the
      # previous install instead of a signature mismatch, and so the
      # app's cert can build reputation with Play Protect over time
      # instead of looking like a brand-new throwaway signer each run.
      - name: Restore release keystore
        env:
          ASHU_RELEASE_KEYSTORE_BASE64: ${{ secrets.ASHU_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ASHU_RELEASE_KEYSTORE_BASE64" ]; then
            echo "❌ ASHU_RELEASE_KEYSTORE_BASE64 secret is empty or not set."
            echo "   Generate one with: keytool -genkey -v -keystore release.keystore ..."
            echo "   then: base64 -w0 release.keystore   (paste output as the secret)"
            exit 1
          fi
          printf '%s' "$ASHU_RELEASE_KEYSTORE_BASE64" | base64 -d > app/ashuphone-release.keystore
          test -s app/ashuphone-release.keystore

      # Writes this keystore's SHA-1 / SHA-256 fingerprints into a FILE (signing-fingerprints.txt) on every build, so a
      # Google Sign-In "error 10" can be fixed by pasting them into the Firebase Console. The fingerprints are NOT
      # printed to the log: this repository is public, and so are its workflow logs and artifacts. The file goes into a
      # DRAFT release further down, which only people with write access to the repository can see. (The same values
      # are also shown inside the app: Account > "Google sign-in error 10?".) This step never fails the build.
      - name: Write release keystore fingerprints to a private file
        env:
          ASHU_RELEASE_STORE_PASSWORD: ${{ secrets.ASHU_RELEASE_STORE_PASSWORD }}
          ASHU_RELEASE_KEY_ALIAS: ${{ secrets.ASHU_RELEASE_KEY_ALIAS }}
        run: |
          {
            echo "Ashu Phone - signing fingerprints (private)"
            echo "Package: com.ashudialer.app"
            echo "Build:   run #${GITHUB_RUN_NUMBER} of ${GITHUB_REPOSITORY}"
            echo ""
            keytool -list -v \
              -keystore app/ashuphone-release.keystore \
              -alias "$ASHU_RELEASE_KEY_ALIAS" \
              -storepass "$ASHU_RELEASE_STORE_PASSWORD" \
              2>/dev/null | grep -E "SHA1:|SHA256:" | sed 's/^ *//' || \
              echo "Could not read the keystore - check the ASHU_RELEASE_KEY_ALIAS / ASHU_RELEASE_STORE_PASSWORD secrets."
            echo ""
            echo "Add them in: Firebase Console -> Project settings -> Your apps -> com.ashudialer.app -> Add fingerprint."
            echo "Then download the new google-services.json and paste it into the GOOGLE_SERVICES_JSON secret."
          } > signing-fingerprints.txt
          echo "Fingerprint file written (not printed - this log is public)."

      # Reads the SHA-256 of the release certificate and exports it, so the build can embed it. The app compares this
      # with the certificate it is really signed with at start-up; a copy that was modified and re-signed with anyone
      # else's key no longer matches. If the fingerprint cannot be read the value stays empty and the check is skipped
      # (the build never fails because of this step).
      - name: Read release certificate SHA-256
        env:
          ASHU_RELEASE_STORE_PASSWORD: ${{ secrets.ASHU_RELEASE_STORE_PASSWORD }}
          ASHU_RELEASE_KEY_ALIAS: ${{ secrets.ASHU_RELEASE_KEY_ALIAS }}
        run: |
          FP=$(keytool -list -v -keystore app/ashuphone-release.keystore -alias "$ASHU_RELEASE_KEY_ALIAS" \
                 -storepass "$ASHU_RELEASE_STORE_PASSWORD" 2>/dev/null \
               | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f' || true)
          if [ "${#FP}" -eq 64 ]; then
            echo "ASHU_CERT_SHA256=$FP" >> "$GITHUB_ENV"
            echo "Embedding certificate fingerprint ${FP:0:8}... into the build"
          else
            echo "::warning::Could not read the certificate fingerprint; the tamper check will be skipped in this build"
          fi

      # Build + sign Release APK in one Gradle pass using the restored
      # keystore. Gradle's own signing pipeline handles zipalign + V2/V3
      # signing internally, so no separate apksigner/zipalign step is
      # needed - keeps build and sign as a single source of truth.
      - name: Build Signed Release APK
        env:
          ASHU_RELEASE_STORE_PASSWORD: ${{ secrets.ASHU_RELEASE_STORE_PASSWORD }}
          ASHU_RELEASE_KEY_ALIAS: ${{ secrets.ASHU_RELEASE_KEY_ALIAS }}
          ASHU_RELEASE_KEY_PASSWORD: ${{ secrets.ASHU_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PASHU_RELEASE_STORE_FILE="ashuphone-release.keystore" \
            -PASHU_RELEASE_STORE_PASSWORD="$ASHU_RELEASE_STORE_PASSWORD" \
            -PASHU_RELEASE_KEY_ALIAS="$ASHU_RELEASE_KEY_ALIAS" \
            -PASHU_RELEASE_KEY_PASSWORD="$ASHU_RELEASE_KEY_PASSWORD" \
            -PASHU_UPDATE_REPO="$GITHUB_REPOSITORY" \
            -PASHU_CERT_SHA256="${ASHU_CERT_SHA256:-}"

      # Find the built APK wherever AGP put it, so a layout change can never break this step.
      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          APK=$(find app/build/outputs/apk -type f -name "*.apk" ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "❌ Release APK was not found."
            echo "Actual APK outputs:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" ci-artifacts/AshuPhone-Release-Signed.apk
          test -s ci-artifacts/AshuPhone-Release-Signed.apk
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AshuPhone-Release-Signed
          path: ci-artifacts/AshuPhone-Release-Signed.apk
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not determine versionName from app/build.gradle.kts"
            exit 1
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ci-artifacts/AshuPhone-Release-Signed.apk --clobber
          else
            gh release create "$TAG" ci-artifacts/AshuPhone-Release-Signed.apk \
              --title "Ashu Phone ${VERSION}" \
              --latest \
              --generate-notes
          fi
          # The in-app updater downloads the asset by the NAME "AshuPhone-<version>.apk" (see
          # public/latest.json). Upload a copy under exactly that name so both the GitHub API
          # fallback and the Firebase manifest URL resolve to a real file.
          cp ci-artifacts/AshuPhone-Release-Signed.apk "ci-artifacts/AshuPhone-${VERSION}.apk"
          gh release upload "$TAG" "ci-artifacts/AshuPhone-${VERSION}.apk" --clobber
          # Mark it as the latest release even when it was created earlier (idempotent).
          gh release edit "$TAG" --latest || true

      # A DRAFT release is invisible to the public - only people with write access to the repository (you) see it, under
      # Releases. It carries signing-fingerprints.txt. Older private drafts are removed first so they do not pile up. This
      # is not the "latest" release, so the in-app updater never sees it. Never fails the build.
      - name: Save fingerprints in a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.name | startswith("Private fingerprints"))) | .id' 2>/dev/null \
            | while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true; done
          gh release create "private-fingerprints-${GITHUB_RUN_NUMBER}" signing-fingerprints.txt \
            --draft \
            --title "Private fingerprints (run ${GITHUB_RUN_NUMBER})" \
            --notes "Signing fingerprints for Firebase. Draft = visible only to repository collaborators." \
            || echo "::warning::Could not create the private draft release (the build itself is fine)."
